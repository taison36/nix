onboarding = false

[keys]
prefix = "ctrl+a"
split_vertical = ["prefix+v", "prefix+i"]
split_horizontal = ["prefix+minus", "prefix+u"]
zoom = "prefix+m"

[theme]
name = "gruvbox"
auto_switch = false

[ui]
prompt_new_tab_name = false

status_indicators = "symbols"
[ui.sound]
enabled = false

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left between Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down between Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up between Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right between Neovim and Herdr panes"

[ui.toast]
delivery = "herdr"
